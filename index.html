<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1917" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Our links, in one place.">
  <title>Hub</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    try {
      var t = localStorage.getItem('hub.theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="page">

    <header class="top">
      <div class="top-left">
        <h1 id="today" class="today">&nbsp;</h1>
        <p id="weather" class="weather"></p>
      </div>
      <div class="top-right">
        <button id="theme-btn" class="icon-btn" type="button" aria-label="Change theme"></button>
        <div class="profile-wrap">
          <button id="profile-btn" class="profile-btn" type="button" aria-haspopup="menu" aria-expanded="false">
            <span id="profile-name">Guest</span>
            <svg viewBox="0 0 24 24" class="chev" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div id="profile-menu" class="menu" role="menu" hidden></div>
        </div>
      </div>
    </header>

    <div id="search-bar" class="search-bar">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search or jump to…" autocomplete="off" spellcheck="false" enterkeyhint="go" aria-label="Search links">
        <kbd class="search-hint" aria-hidden="true">/</kbd>
      </label>
    </div>

    <main id="main" class="main" aria-live="polite"></main>

    <footer id="foot" class="foot"></footer>
  </div>

  <!-- Link details (mirrors, pin, description) -->
  <div id="sheet" class="overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <span id="sheet-icon" class="tile-icon"></span>
        <div>
          <h2 id="sheet-title" class="sheet-title"></h2>
          <p id="sheet-host" class="sheet-host"></p>
        </div>
        <button class="icon-btn sheet-close" type="button" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <p id="sheet-desc" class="sheet-desc"></p>
      <div id="sheet-mirrors" class="sheet-mirrors"></div>
      <div class="sheet-actions">
        <button id="sheet-pin" class="btn" type="button"></button>
        <a id="sheet-open" class="btn btn-primary" target="_blank" rel="noopener">Open</a>
      </div>
    </div>
  </div>

  <!-- PIN pad -->
  <div id="pin" class="overlay" hidden>
    <div class="pin" role="dialog" aria-modal="true" aria-labelledby="pin-title">
      <h2 id="pin-title" class="pin-title">Enter PIN</h2>
      <p id="pin-sub" class="pin-sub"></p>
      <div id="pin-dots" class="pin-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="pin-pad" id="pin-pad">
        <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
        <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
        <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
        <button type="button" data-a="cancel" class="pin-soft">Cancel</button><button type="button" data-k="0">0</button><button type="button" data-a="back" class="pin-soft" aria-label="Delete">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M13 10l4 4M17 10l-4 4"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
