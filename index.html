<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121316">
  <meta name="description" content="Personal Homelab, Library & Self-Hosted Services Dashboard">
  
  <title>Homelab Hub</title>

  <!-- PWA & Favicons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Header Area -->
    <header class="dashboard-header">
      <div class="brand">
        <img src="icon.svg" alt="Homelab Hub Logo" class="brand-logo">
        <h1 class="brand-title">Homelab Hub</h1>
      </div>

      <div class="header-controls">
        <button id="guestToggle" class="control-btn" title="Toggle Guest Mode" aria-label="Toggle Guest Mode">
          <span class="material-icons" id="guestToggleIcon">visibility</span>
          <span id="guestToggleText">All Services</span>
        </button>
        <button id="installBtn" class="control-btn" style="display: none;" title="Install Homelab Hub" aria-label="Install App">
          <span class="material-icons">install_mobile</span>
          <span>Install</span>
        </button>
      </div>
    </header>

    <!-- Search & Command Bar -->
    <section class="search-section">
      <div class="search-input-wrapper">
        <span class="material-icons search-icon">search</span>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search services, apps, tags..." 
          autocomplete="off" 
          spellcheck="false"
        >
        <kbd class="search-kbd" title="Press / to search">/</kbd>
      </div>
    </section>

    <!-- Category Filter Tabs -->
    <nav class="category-nav" aria-label="Service categories">
      <button class="nav-tab active" data-tab="all">All</button>
      <button class="nav-tab" data-tab="library">Library</button>
      <button class="nav-tab" data-tab="streaming">Media & Streaming</button>
      <button class="nav-tab" data-tab="study">Language & Study</button>
      <button class="nav-tab" data-tab="projects">Projects & Writing</button>
      <button class="nav-tab" data-tab="systems">Infrastructure</button>
    </nav>

    <!-- Services Grid Container -->
    <main class="services-container" id="servicesGrid" aria-live="polite">
      <!-- Cards rendered dynamically via script.js -->
    </main>

    <!-- Empty State -->
    <div id="noResults" class="empty-state" style="display: none;">
      <span class="material-icons empty-icon">search_off</span>
      <p class="empty-text">No matching services found</p>
    </div>
  </div>

  <!-- Scripts -->
  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => {
          console.error('Service Worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
